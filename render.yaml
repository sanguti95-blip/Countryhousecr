services:
  # 1. Back-End Express REST API Web Service
  - type: web
    name: country-house-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://lpfnupdjitpndbpdxarc.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_eseciU62cOTQsx99FNFhLw_Nwu6uTZE

  # 2. Front-End Client & Admin Static Site
  - type: static
    name: country-house-web
    plan: free
    region: oregon
    buildCommand: echo "Client static site ready"
    staticPublishPath: client
